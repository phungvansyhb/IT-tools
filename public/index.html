    <script>
      (function () {
        var SUPPORTED = ['en', 'vi', 'ja', 'zh'];
        function normalize(val) {
          if (!val) return null;
          var primary = String(val).trim().toLowerCase().split(/[-_]/)[0];
          return SUPPORTED.indexOf(primary) !== -1 ? primary : null;
        }
        var target = null;
        try {
          target = normalize(window.localStorage.getItem('omnidev_locale'));
        } catch (_) {}
        if (!target && document.cookie) {
          var match = document.cookie.match(/(?:^|;\s*)omnidev_locale=([^;]+)/);
          if (match) target = normalize(decodeURIComponent(match[1]));
        }
        if (!target && navigator) {
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < langs.length; i++) {
            var found = normalize(langs[i]);
            if (found) {
              target = found;
              break;
            }
          }
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.replace('/' + (target || 'en') + search + hash);
      })();
    </script>
